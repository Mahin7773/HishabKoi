plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'com.example.hishabkoi'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.hishabkoi"
        minSdk 34
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // R8 removes unused code from the libraries (Firebase, Material...), then unused
            // resources. This takes the APK from ~30 MB to a few MB.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so the release APK installs directly. Use your own
            // release key before publishing to the Play Store.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.firebase.auth
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.firestore
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    implementation libs.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}